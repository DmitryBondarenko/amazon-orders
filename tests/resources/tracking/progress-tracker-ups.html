<!DOCTYPE html>
<!-- Synthetic fixture: the structure of Amazon's package tracking page (/progress-tracker/package), fake values. -->
<html>
<head><title>Your Account</title></head>
<body>
<div class="a-row" id="pt-page-container-inner">
  <div class="a-row pt-main-container">
    <div class="pt-map-outer-container pt-map-type-static">
      <div class="pt-floating-map-card">
        <section class="pt-card delivery-card">
          <div class="pt-delivery-card-wrapper">
            <div class="pt-promise-main-slot"><span class="pt-promise-main-slot-text">Delivered</span></div>
            <div class="pt-delivery-card-trackingId">Tracking ID: 1Z999AA10123456784</div>
          </div>
        </section>
      </div>
    </div>
    <div class="a-popover-preload" id="a-popover-tracking-events-modal">
      <div class="tracking-events-modal-inner" id="tracking-events-container">
        <div class="a-container">

          </div>

          <div class="a-row tracking-event-date-header"><span class="tracking-event-date">Tuesday, January 6</span></div>
          <div class="a-row a-spacing-large a-spacing-top-medium">
            <div class="a-column a-span3 tracking-event-time-left"><span class="tracking-event-time">11:02 AM</span></div>
            <div class="a-column a-span9 tracking-event-time-right a-span-last">
              <span class="tracking-event-message">Package delivered.</span>
              <div class="a-row"><span class="tracking-event-location">ANYTOWN, US</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

</html>
